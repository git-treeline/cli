name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test (race)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Formatting
        run: make fmt-check

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Build (all platforms)
        run: |
          go build ./...
          GOOS=linux go build ./...

      - name: Smoke test the binary
        run: |
          go build -o /tmp/gtl .
          /tmp/gtl version
          /tmp/gtl --help >/dev/null
          /tmp/gtl status --json >/dev/null
          /tmp/gtl completion bash >/dev/null

      - name: Smoke test source installation
        run: |
          install_dir="$(mktemp -d)"
          make install GOBIN="$install_dir"
          "$install_dir/git-treeline" version
          "$install_dir/gtl" version
          go_install_dir="$(mktemp -d)"
          GOBIN="$go_install_dir" go install ./cmd/git-treeline
          "$go_install_dir/git-treeline" version

  ci-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Full suite on the primary platform (launchd, pfctl, keychain, /etc/hosts).
      - name: Test (race)
        run: go test -race ./...

      - name: Build
        run: go build ./...
